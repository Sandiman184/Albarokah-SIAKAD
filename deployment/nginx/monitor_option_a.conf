# Konfigurasi untuk Monitoring Netdata (Opsi A: Subdomain Terpisah)
# File: /etc/nginx/sites-available/monitor.albarokahsidomakmur.ponpes.id

server {
    listen 80;
    server_name monitor.albarokahsidomakmur.ponpes.id;

    # Logs
    access_log /var/log/nginx/netdata_access.log;
    error_log /var/log/nginx/netdata_error.log;

    location / {
        proxy_pass http://127.0.0.1:19999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Basic Auth Protection
        auth_basic "Restricted Access - Monitoring";
        auth_basic_user_file /etc/nginx/.netdata_htpasswd;
        
        # Connection settings for Netdata streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_store off;
    }
}
